name: FFmpeg XMA decoder tests
on:
  push:
    paths:
      - 'SonicGenerationsRecomp/apu/**'
      - 'cmake/Xma*.cmake'
      - 'cmake/xma_ffmpeg_config.h'
      - 'tools/ffmpeg-xma'
      - 'tests/audio/**'
      - '.github/workflows/audio-tests.yml'
  pull_request:
    paths:
      - 'SonicGenerationsRecomp/apu/**'
      - 'cmake/Xma*.cmake'
      - 'cmake/xma_ffmpeg_config.h'
      - 'tools/ffmpeg-xma'
      - 'tests/audio/**'
      - '.github/workflows/audio-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  decoder:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned frame decoder
        run: git submodule update --init tools/ffmpeg-xma
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S tests/audio -B build-audio -DCMAKE_BUILD_TYPE=Debug
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S tests/audio -B build-audio -G 'Visual Studio 17 2022' -A x64 -T ClangCL
      - name: Build
        run: cmake --build build-audio --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build-audio -C Debug --output-on-failure
      - name: Decode public FFmpeg regression sample (no artifacts)
        shell: bash
        run: |
          mkdir -p private/audio-test
          curl --fail --location --retry 3 --max-time 60 'https://samples.ffmpeg.org/game-formats/xma/M02_bvo01_14.xma' -o private/audio-test/sample.xma
          echo 'b6226491dd6e07606e52b7b0c853d0c6  private/audio-test/sample.xma' | md5sum --check
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./build-audio/Debug/xma_sample_test.exe private/audio-test/sample.xma
          else
            ./build-audio/xma_sample_test private/audio-test/sample.xma
          fi
      - name: Remove sample
        if: always()
        shell: bash
        run: rm -rf private/audio-test
