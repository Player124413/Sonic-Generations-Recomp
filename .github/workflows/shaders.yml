name: Experimental Xbox 360 shaders

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct HTTPS link to ZIP (NOT secret). Empty = use SHADERS_ZIP_URL secret'
        required: false
        type: string
      sha256:
        description: 'Optional expected SHA-256; leave empty to calculate automatically'
        required: false
        type: string
      upload_result:
        description: 'Upload derived shaders (accessible to repository readers!)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  convert:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pipeline
        run: python -m unittest discover -s tests -p test_shader_pipeline.py -v
      - name: Fetch pinned XenosRecomp dependencies
        run: |
          git submodule update --init --recursive tools/XenosRecomp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Apply Generations boolean-register support
        run: |
          git -C tools/XenosRecomp apply --check ../../patches/xenos-generations-booleans.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C tools/XenosRecomp apply ../../patches/xenos-generations-booleans.patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build XenosRecomp with DXIL and SPIR-V support
        run: |
          cmake -S tools/XenosRecomp -B build-shaders -G 'Visual Studio 17 2022' -A x64 -T ClangCL -DXENOS_RECOMP_DXIL=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DZSTD_BUILD_SHARED=OFF -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF -DXXHASH_BUILD_XXHSUM=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Build only the converter and its dependencies, not ALL_BUILD.
          # The unused Zstd DLL resource fails with Windows RC + Clang headers.
          # Assertions detect upstream conversion/compiler failures.
          cmake --build build-shaders --config Debug --target XenosRecomp --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download, validate and convert shader ZIP
        env:
          ZIP_URL_INPUT: ${{ inputs.zip_url }}
          SHADERS_ZIP_URL: ${{ secrets.SHADERS_ZIP_URL }}
          ZIP_SHA256: ${{ inputs.sha256 }}
        run: |
          python scripts/shader_pipeline.py --xenos build-shaders/XenosRecomp/Debug/XenosRecomp.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload experimental result (explicit opt-in)
        if: ${{ success() && inputs.upload_result }}
        uses: actions/upload-artifact@v4
        with:
          name: experimental-shaders-${{ github.run_id }}
          path: private/shader-build/result/
          retention-days: 1
          if-no-files-found: error
      - name: Upload failed shader diagnostics (explicit opt-in)
        if: ${{ failure() && inputs.upload_result }}
        uses: actions/upload-artifact@v4
        with:
          name: shader-diagnostics-${{ github.run_id }}
          path: private/shader-build/diagnostics/
          retention-days: 1
          if-no-files-found: ignore
      - name: Remove private data
        if: always()
        run: |
          if (Test-Path private/shader-build) { Remove-Item private/shader-build -Recurse -Force }
