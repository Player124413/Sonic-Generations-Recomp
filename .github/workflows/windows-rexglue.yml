name: Windows ReXGlue migration
on:
  workflow_dispatch:
    inputs:
      build_game:
        description: 'Also try the pinned external Sonic PPC candidate (SDK compatibility not yet confirmed)'
        type: boolean
        default: false
  push:
    paths:
      - 'rex/**'
      - 'SonicGenerationsRecomp/gpu/**'
      - 'cmake/VulkanHost.cmake'
      - 'cmake/ShaderCache.cmake'
      - 'cmake/GpuResources.cmake'
      - '.github/workflows/windows-rexglue.yml'
permissions:
  contents: read
concurrency:
  group: rex-windows-${{ github.ref }}
  # Preserve an almost-finished full link when a follow-up fix is pushed.
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The official Windows 0.10.0 ZIP builds D3D12 only. Build the entire SDK
      # consistently, not a Vulkan DLL mixed with a differently configured runtime.
      - name: Read Vulkan-only SDK source pin
        id: sdk
        run: |
          $pins = Get-Content rex/dependencies.json -Raw | ConvertFrom-Json
          "repository=$($pins.sdk.repository)" | Add-Content $env:GITHUB_OUTPUT
          "commit=$($pins.sdk.commit)" | Add-Content $env:GITHUB_OUTPUT
          "REXSDK_PREFIX=$env:GITHUB_WORKSPACE/build-rex-sdk-install" | Add-Content $env:GITHUB_ENV
      - uses: actions/cache/restore@v4
        id: sdk-cache
        with:
          path: build-rex-sdk-install
          key: windows-2022-rex-vulkan-only-release-v3-unmodified-${{ steps.sdk.outputs.commit }}-${{ env.ImageVersion }}
      - name: Fetch exact SDK source and dependencies
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.sdk.outputs.repository }}
          ref: ${{ steps.sdk.outputs.commit }}
          path: build-rex-sdk-source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and install matching Vulkan-only SDK runtime and plugin
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        working-directory: build-rex-sdk-source
        run: |
          if ((git rev-parse HEAD) -ne '${{ steps.sdk.outputs.commit }}') { throw 'SDK source pin mismatch' }
          cmake --preset win-amd64 "-DCMAKE_INSTALL_PREFIX=$env:REXSDK_PREFIX" -DREXGLUE_USE_VULKAN=ON -DREXGLUE_USE_D3D12=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build out/build/win-amd64 --config Release --target install --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{
            loader_patch = 'none'
            commit = '${{ steps.sdk.outputs.commit }}'
            configuration = 'Release'
            REXGLUE_USE_VULKAN = 'ON'
            REXGLUE_USE_D3D12 = 'OFF'
          } | ConvertTo-Json | Set-Content "$env:REXSDK_PREFIX/sonic-sdk-build.json"
      - name: Verify SDK build provenance
        run: |
          $built = Get-Content "$env:REXSDK_PREFIX/sonic-sdk-build.json" -Raw | ConvertFrom-Json
          if ($built.loader_patch -ne 'none' -or $built.commit -ne '${{ steps.sdk.outputs.commit }}' -or $built.REXGLUE_USE_VULKAN -ne 'ON' -or $built.REXGLUE_USE_D3D12 -ne 'OFF') {
            throw 'Wrong SDK configuration in install/cache'
          }
      # Cache a successfully built SDK even if a later runtime test fails.
      # This is a build cache, NOT a certification or a distributable game artifact.
      - uses: actions/cache/save@v4
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        with:
          path: build-rex-sdk-install
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Fetch pinned shader codecs and resource hashing
        run: |
          git submodule update --init tools/XenosRecomp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C tools/XenosRecomp submodule update --init thirdparty/smol-v thirdparty/zstd thirdparty/xxHash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure SDK integration contracts
        run: >-
          cmake -S rex -B build-rex-contract -G "Visual Studio 17 2022" -A x64 -T ClangCL
          "-DCMAKE_PREFIX_PATH=$env:REXSDK_PREFIX" -DSONIC_REX_BUILD_GAME=OFF
      - name: Build and test forwarding contracts against the real SDK
        id: contracts
        run: |
          cmake --build build-rex-contract --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-rex-contract -C Release --output-on-failure --timeout 30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Trace plugin failure under the Windows debugger
        if: failure() && steps.contracts.outcome == 'failure'
        run: |
          $tracer = './build-rex-contract/Release/windows_crash_trace.exe'
          $test = './build-rex-contract/Release/rex_vulkan_plugin_tests.exe'
          if ((Test-Path $tracer) -and (Test-Path $test)) {
            $PSNativeCommandUseErrorActionPreference = $false
            & $tracer (Resolve-Path $test).Path 2>&1 | Tee-Object build-rex-contract/plugin-crash-trace.log
            $LASTEXITCODE | Set-Content build-rex-contract/plugin-debuggee-exit.txt
          }
          # Diagnostics never change the preceding failed CTest step.
          exit 0
      - name: Preserve plugin regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rex-vulkan-plugin-diagnostics
          path: |
            build-rex-contract/plugin-crash-trace.log
            build-rex-contract/plugin-debuggee-exit.txt
            build-rex-contract/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Run the policy test suite (annotated)
        # This step runs the whole suite, which is the only thing that catches a
        # policy change breaking a test in a different file. A failure has to name
        # the test: the run logs are not always readable, and "process completed
        # with exit code 1" is not a diagnosis.
        run: |
          python -m unittest discover -s rex/tests -p "test_*.py" -v > policy-tests.log 2>&1
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content policy-tests.log |
              Select-String -Pattern '^(FAIL|ERROR): |^AssertionError|^ValueError|^Ran \d+ tests|^FAILED' |
              Select-Object -Last 30 | ForEach-Object { $_.Line -join ' ' }
            $summary = ($lines -join ' | ') -replace '%', '%25'
            if ($summary.Length -gt 3000) { $summary = $summary.Substring($summary.Length - 3000) }
            Write-Host "::error title=policy tests failed::exit code $code; $summary"
            exit 1
          }
          exit 0
      - name: Read generated-code pin
        if: github.event_name == 'push' || inputs.build_game
        id: source
        run: |
          $pins = Get-Content rex/dependencies.json -Raw | ConvertFrom-Json
          "repository=$($pins.generated_candidate.repository)" | Add-Content $env:GITHUB_OUTPUT
          "commit=$($pins.generated_candidate.commit)" | Add-Content $env:GITHUB_OUTPUT
          "directory=$($pins.generated_candidate.directory)" | Add-Content $env:GITHUB_OUTPUT
      - name: Fetch candidate PPC from the user's reference project
        if: github.event_name == 'push' || inputs.build_game
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: build-rex-source
          sparse-checkout: ${{ steps.source.outputs.directory }}
          persist-credentials: false
      - name: Install native Vulkan build dependencies
        if: github.event_name == 'push' || inputs.build_game
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install vulkan-headers:x64-windows vulkan-loader:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure the separate game host
        if: github.event_name == 'push' || inputs.build_game
        run: >-
          cmake -S rex -B build-rex-game -G "Visual Studio 17 2022" -A x64 -T ClangCL
          "-DCMAKE_PREFIX_PATH=$env:REXSDK_PREFIX" -DSONIC_REX_BUILD_GAME=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          "-DSONIC_REX_GENERATED_DIR=${{ github.workspace }}/build-rex-source/${{ steps.source.outputs.directory }}"
      - name: Compile real host and first generated TU before the full game
        if: github.event_name == 'push' || inputs.build_game
        run: cmake --build build-rex-game --config Release --target sonic_rex_api_probe --parallel 2
      - name: Link native Vulkan backend and decode embedded SPIR-V before PPC build
        if: github.event_name == 'push' || inputs.build_game
        run: |
          cmake --build build-rex-game --config Release --target rex_native_backend_link_test --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/vulkan-1.dll" build-rex-game/Release/
          ctest --test-dir build-rex-game -C Release -R '^rex_native_backend_link$' --output-on-failure --timeout 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure our own GPU plugin against the SDK
        # The plugin is a separate CMake project, so it needs the same dependency
        # wiring the game host gets. Without the vcpkg toolchain `find_package(
        # Vulkan)` has nothing to find, and because this job must stay green for
        # the reference package, that failure used to be invisible -- which is
        # how a package shipped with no DLL in it while the "plugin built"
        # marker said the opposite. Failures are non-blocking for the package but
        # are reported as an annotation with the log tail, so the reason is
        # readable even when artifact and log download is unavailable.
        continue-on-error: true
        if: github.event_name == 'push' || inputs.build_game
        run: |
          $log = 'native-plugin-configure.log'
          cmake -S rex -B build-rex-plugin -G "Visual Studio 17 2022" -A x64 -T ClangCL `
            "-DCMAKE_PREFIX_PATH=$env:REXSDK_PREFIX" -DSONIC_REX_BUILD_NATIVE_PLUGIN=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows *>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 60) -join ' | ') -replace '%', '%25'
            Write-Host "::error title=rexgpu-native configure failed::$tail"
            exit 1
          }
      - name: Build our own GPU plugin against the SDK (experimental)
        # Non-blocking on purpose: the plugin is our replacement for the SDK's
        # Xenos plugin and is still being written. This step exists so every run
        # ships the DLL if it built, while the reference path keeps shipping.
        # Once the render opcodes are in, it becomes blocking and the host
        # switches to it by default.
        continue-on-error: true
        if: github.event_name == 'push' || inputs.build_game
        run: |
          $log = 'native-plugin-build.log'
          cmake --build build-rex-plugin --config Release --target rexgpu-native --parallel 2 *>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 60) -join ' | ') -replace '%', '%25'
            Write-Host "::error title=rexgpu-native build failed::$tail"
            exit 1
          }
          # A build that "succeeded" without a DLL is the failure mode that put a
          # package in the user's hands without the plugin it needs, so the file is
          # found rather than assumed. Searching also means a generator that lays
          # its output out differently cannot quietly drop the plugin again --
          # which is exactly what happened when the build put it in
          # build-rex-plugin/plugins/native/Release.
          $dll = Get-ChildItem -Path build-rex-plugin -Recurse -Filter 'rexgpu-native.dll' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (-not $dll) {
            $found = (Get-ChildItem -Path build-rex-plugin -Recurse -Filter '*.dll' -ErrorAction SilentlyContinue |
              Select-Object -First 20 | ForEach-Object { $_.FullName }) -join ' | '
            Write-Host "::error title=rexgpu-native produced no DLL::the build reported success but no rexgpu-native.dll exists under build-rex-plugin; DLLs found: $found"
            exit 1
          }
          # One stable path for the jobs that follow: the package staging and the
          # artifact upload must not each guess where the generator put it.
          New-Item -ItemType Directory -Force native-plugin | Out-Null
          Copy-Item $dll.FullName native-plugin/rexgpu-native.dll -Force
          Get-ChildItem native-plugin/rexgpu-native.dll | Select-Object Name, Length
          Write-Host "rexgpu-native.dll built at $($dll.FullName)"
      - name: Upload our plugin DLL
        # Its own artifact, small and next to the marker: the plugin is what the
        # native data run needs, and re-downloading the whole reference package to
        # get one DLL is how a user ends up with a stale plugin.
        if: success() && (github.event_name == 'push' || inputs.build_game)
        uses: actions/upload-artifact@v4
        with:
          name: rexgpu-native-plugin
          path: |
            native-plugin/rexgpu-native.dll
            native-plugin/rex_gpu_replay.exe
          if-no-files-found: warn
        continue-on-error: true
      - name: Keep the plugin's symbols
        # A crash report from a user's machine names a module and an offset
        # ("rexgpu-native.dll+0x2f41"). Without the PDB that offset cannot be
        # turned back into a function, which is the difference between reading
        # the report and guessing from it.
        if: success() && (github.event_name == 'push' || inputs.build_game)
        run: |
          $pdb = Get-ChildItem -Path build-rex-plugin -Recurse -Filter 'rexgpu-native.pdb' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if ($pdb) {
            Copy-Item $pdb.FullName native-plugin/rexgpu-native.pdb -Force
            Write-Host "rexgpu-native.pdb taken from $($pdb.FullName)"
          } else {
            Write-Host '::warning title=no plugin symbols::rexgpu-native.pdb was not found; a crash offset from a user report cannot be resolved'
          }
        continue-on-error: true
      - name: Upload our plugin's symbols
        if: success() && (github.event_name == 'push' || inputs.build_game)
        uses: actions/upload-artifact@v4
        with:
          name: rexgpu-native-symbols
          path: native-plugin/rexgpu-native.pdb
          if-no-files-found: warn
        continue-on-error: true
      - name: Test the device and presenter in the plugin configuration
        # The device tests belong to this configuration too: the presenter and the
        # recorder are only useful if they keep passing against the same SDK.
        continue-on-error: true
        if: success() && (github.event_name == 'push' || inputs.build_game)
        run: |
          $log = 'native-plugin-tests.log'
          cmake --build build-rex-plugin --config Release `
            --target rex_presenter_logic_tests rex_stream_dump_tests `
                     rex_pm4_tests rex_gpu_device_tests rex_render_state_tests `
                     rex_replay_tests rex_gpu_replay --parallel 2 *>&1 |
            Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 60) -join ' | ') -replace '%', '%25'
            Write-Host "::error title=rexgpu-native device tests did not build::$tail"
            exit 1
          }
          ctest --test-dir build-rex-plugin -C Release -R '^(rex_presenter_logic|rex_stream_dump|rex_pm4|rex_gpu_device|rex_render_state|rex_replay)$' --output-on-failure --timeout 120 *>&1 |
            Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) {
            $tail = ((Get-Content $log -Tail 60) -join ' | ') -replace '%', '%25'
            Write-Host "::error title=rexgpu-native device tests failed::$tail"
            exit 1
          }
          # The replay tool is what a recorded run is read with, and a tool that
          # cannot even print its usage is a file, not a tool.
          $replay = Get-ChildItem -Path build-rex-plugin -Recurse -Filter 'rex_gpu_replay.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch 'CMakeFiles' } | Select-Object -First 1
          if (-not $replay) {
            Write-Host '::error title=rex_gpu_replay was not built::the replay of recorded streams is the renderer workbench'
            exit 1
          }
          New-Item -ItemType Directory -Force native-plugin | Out-Null
          Copy-Item $replay.FullName native-plugin/rex_gpu_replay.exe -Force
          & $replay.FullName --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error title=rex_gpu_replay cannot run::the tool exited non-zero on --help'
            exit 1
          }
      - name: Test recovered guest entries before PPC build
        id: entries
        if: github.event_name == 'push' || inputs.build_game
        run: |
          cmake --build build-rex-game --config Release --target rex_guest_entry_recovery_tests --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-rex-game -C Release -R '^rex_guest_entry_recovery$' --output-on-failure --timeout 60
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The artifact must be checked, not just uploaded and admired.
          python rex/tools/validate_guest_entry_audit.py build-rex-game/entry-recovery/guest-entry-audit.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Trace recovered-entry test failure under the Windows debugger
        if: failure() && steps.entries.outcome == 'failure'
        run: |
          $tracer = './build-rex-contract/Release/windows_crash_trace.exe'
          $test = (Resolve-Path ./build-rex-game/Release/rex_guest_entry_recovery_tests.exe).Path
          if (Test-Path $tracer) {
            $PSNativeCommandUseErrorActionPreference = $false
            & $tracer $test 2>&1 | Tee-Object build-rex-game/entry-recovery/entry-recovery-trace.log
          }
          # Diagnostics never change the preceding failed step.
          exit 0
      - name: Preserve guest entry audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rex-guest-entry-audit
          path: |
            build-rex-game/entry-recovery/guest-entry-audit.json
            build-rex-game/entry-recovery/entry-recovery-trace.log
            build-rex-game/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Build the candidate (fail on incompatible generated ABI)
        if: github.event_name == 'push' || inputs.build_game
        run: cmake --build build-rex-game --config Release --parallel 2
      - name: Game host CLI smoke test (not a game boot)
        if: github.event_name == 'push' || inputs.build_game
        run: |
          & ./build-rex-game/Release/SonicGenerationsRecomp-ReXGlue.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage reference-path package
        if: github.event_name == 'push' || inputs.build_game
        run: |
          New-Item -ItemType Directory package-rex | Out-Null
          Copy-Item build-rex-game/Release/SonicGenerationsRecomp-ReXGlue.exe package-rex/
          # The replay tool is how a recorded run becomes a renderer work item on
          # the player's own machine: the recording stays where it was written.
          # Two configured build trees can hold it, and guessing one of them is
          # how a package ends up without a tool that two steps claim to ship.
          $replaySources = @('build-rex-game/Release/rex_gpu_replay.exe', 'native-plugin/rex_gpu_replay.exe')
          $replayBuilt = $replaySources | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($replayBuilt) {
            Copy-Item $replayBuilt package-rex/rex_gpu_replay.exe -Force
          } else {
            Write-Host '::warning title=no replay tool in the package::rex_gpu_replay.exe was not built in any configuration'
          }
          Copy-Item build-rex-game/Release/rex_vulkan_plugin_tests.exe package-rex/
          Copy-Item "$env:REXSDK_PREFIX/sonic-sdk-build.json" package-rex/
          Get-ChildItem build-rex-game/Release/*.dll | Copy-Item -Destination package-rex/
          if (!(Test-Path package-rex/rexgpu-xenos.dll)) { throw 'Xenos reference plugin missing' }
          # Our own plugin ships next to the reference one when it built. Shipping
          # it does not switch the default renderer: the host still loads xenos
          # unless SONIC_REX_GRAPHICS_MODE=native, and Run-Native-GPU-Dump.cmd
          # refuses to start without it instead of falling back.
          if (Test-Path native-plugin/rexgpu-native.dll) {
            Copy-Item native-plugin/rexgpu-native.dll package-rex/
            if (-not (Test-Path package-rex/rexgpu-native.dll)) {
              throw 'rexgpu-native.dll was built but is missing from the package'
            }
          } else {
            # Loud on purpose. A package without this DLL cannot run the native
            # data launcher, and the previous version of this step said so only in
            # a log line nobody reads.
            Write-Host '::error title=package without our GPU plugin::rexgpu-native.dll was not built; Run-Native-GPU-Dump.cmd will refuse to start from this package'
          }
          Copy-Item build-rex-game/entry-recovery/guest-entry-audit.json package-rex/
          # The debugger supervisor: the user's crash left no report inside the
          # process, and this is the tool that reports it from outside.
          $tracer = 'build-rex-contract/Release/windows_crash_trace.exe'
          if (Test-Path $tracer) {
            Copy-Item $tracer package-rex/
          } else {
            Write-Host '::warning title=no crash tracer in the package::windows_crash_trace.exe was not built; Run-Native-GPU-Trace.cmd will refuse to start'
          }
          Copy-Item rex/tools package-rex/tools -Recurse
          Copy-Item rex/windows/*.cmd,rex/README.md,rex/dependencies.json,COPYING,THIRD_PARTY.md package-rex/
          Copy-Item licenses package-rex/licenses -Recurse
          foreach ($port in @('vulkan-headers','vulkan-loader')) {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/$port/copyright" "package-rex/licenses/$port-copyright.txt"
          }
          Copy-Item tools/XenosRecomp/thirdparty/xxHash/LICENSE package-rex/licenses/xxHash-LICENSE.txt
          Copy-Item tools/XenosRecomp/thirdparty/smol-v/license.txt package-rex/licenses/smol-v-LICENSE.txt
          Copy-Item tools/XenosRecomp/thirdparty/zstd/LICENSE package-rex/licenses/zstd-LICENSE.txt
          # Preserve the SDK's redistributed notices/resources, rather than stripping them.
          Copy-Item "$env:REXSDK_PREFIX/share" package-rex/sdk-share -Recurse
          Get-ChildItem "$env:REXSDK_PREFIX" -File | Where-Object { $_.Name -match 'LICENSE|COPYING|NOTICE' } | Copy-Item -Destination package-rex/
          git rev-parse HEAD | Set-Content package-rex/revision.txt
      # The two checks below were one step, and a failure in it said only
      # "exit code 1": the probe of the packaged Xenos factory exits without a
      # message, and the replay tool reports on stderr, which a native command
      # under the runner's error preference turns into a terminating error. This
      # job is the reference path, so its failures have to be readable from the
      # annotation alone -- the run logs cannot always be downloaded.
      - name: Check the packaged Xenos Vulkan factory (no GPU required)
        if: github.event_name == 'push' || inputs.build_game
        run: |
          # What the package actually contains, as an annotation: "the DLL is
          # missing" and "the DLL is there but the factory fails" are different
          # problems and must not look the same.
          $listing = ((Get-ChildItem package-rex -File | Sort-Object Name |
            ForEach-Object { "$($_.Name)=$($_.Length)" }) -join ' ')
          if ($listing.Length -gt 1800) { $listing = $listing.Substring(0, 1800) + '...' }
          Write-Host "::notice title=staged package-rex::$listing"

          # Start-Process is used instead of `&` on purpose: a probe whose
          # nonzero exit code is expected must not leave that code in
          # $LASTEXITCODE, because a step inherits the exit code of the last
          # native command it ran.
          $probe = Start-Process -FilePath ./package-rex/rex_vulkan_plugin_tests.exe -Wait -PassThru `
            -NoNewWindow -RedirectStandardOutput vulkan-plugin-test.out -RedirectStandardError vulkan-plugin-test.log
          $factoryCode = $probe.ExitCode
          $factoryTail = ''
          if (Test-Path vulkan-plugin-test.log) {
            $factoryTail = ((Get-Content vulkan-plugin-test.log -Tail 25) -join ' | ') -replace '%', '%25'
          }
          if (Test-Path vulkan-plugin-test.out) {
            $factoryTail += ((Get-Content vulkan-plugin-test.out -Tail 25) -join ' | ') -replace '%', '%25'
          }
          Write-Host "::notice title=packaged Xenos Vulkan factory probe::exit code $factoryCode; $factoryTail"
          if ($factoryCode -ne 0) {
            Write-Host "::error title=packaged Xenos Vulkan factory probe failed::exit code $factoryCode; $factoryTail"
            exit 1
          }
          exit 0
      - name: Check the replay tool reports an empty recording (no recording in CI)
        if: github.event_name == 'push' || inputs.build_game
        run: |
          # Nothing has been recorded in CI, so the honest answer of the replay
          # tool is the "nothing to replay" exit code 2 with instructions -- not a
          # crash, and not a zero that would look like a successful replay. The
          # empty directory is passed explicitly so the check does not depend on
          # the working directory.
          $replay = './package-rex/rex_gpu_replay.exe'
          if (-not (Test-Path $replay)) {
            Write-Host '::error title=the package has no replay tool::rex_gpu_replay.exe is missing from package-rex'
            exit 1
          }
          $replaySmokeDir = Join-Path $env:RUNNER_TEMP 'rex-empty-replay'
          New-Item -ItemType Directory -Force $replaySmokeDir | Out-Null
          # The tool reports "nothing to replay" on stderr and exits with 2, so
          # the call is made through Start-Process: `&` would both raise a native
          # stderr error under the runner's error preference and leave the
          # expected exit code 2 in $LASTEXITCODE, which the step then inherits as
          # its own result. Exit code 2 is the check passing, not the step
          # failing.
          $smoke = Start-Process -FilePath $replay -ArgumentList @($replaySmokeDir, '--quiet') -Wait -PassThru `
            -NoNewWindow -RedirectStandardOutput replay-smoke.out -RedirectStandardError replay-smoke.log
          $replayCode = $smoke.ExitCode
          $replayTail = ''
          foreach ($log in @('replay-smoke.log', 'replay-smoke.out')) {
            if (Test-Path $log) {
              $replayTail += ((Get-Content $log -Tail 20) -join ' | ') -replace '%', '%25'
            }
          }
          Write-Host "::notice title=rex_gpu_replay on an empty directory::exit code $replayCode; $replayTail"
          if ($replayCode -ne 2) {
            Write-Host "::error title=rex_gpu_replay did not report an empty recording::exit code $replayCode; output: $replayTail"
            exit 1
          }
          exit 0
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.build_game
        with:
          name: windows-x64-rexglue-reference-candidate
          path: package-rex/
          if-no-files-found: error
      - name: State exactly what was checked
        run: |
          @'
          ## ReXGlue migration gate
          Passed: host contracts and actual staged Xenos Vulkan factory against source-built SDK 0.10.0.
          SDK configuration: Vulkan ON, D3D12 OFF; source commit and recipe included in package.
          Optional game build uses the pinned external generated-code candidate; no original XEX is uploaded.
          A built EXE / --help does NOT prove title boot, gameplay, shadow rendering or native GPU replacement.
          Reference Xenos plugin is retained and explicitly selected with Vulkan.
          When it built, rexgpu-native.dll is staged next to it for
          Run-Native-GPU-Dump.cmd (SONIC_REX_GRAPHICS_MODE=native) and uploaded
          separately as the rexgpu-native-plugin artifact; the default renderer is
          unchanged unless that variable is set.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
