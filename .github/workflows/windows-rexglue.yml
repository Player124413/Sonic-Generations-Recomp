name: Windows ReXGlue migration
on:
  workflow_dispatch:
    inputs:
      build_game:
        description: 'Also try the pinned external Sonic PPC candidate (SDK compatibility not yet confirmed)'
        type: boolean
        default: false
  push:
    paths:
      - 'rex/**'
      - 'SonicGenerationsRecomp/gpu/**'
      - 'cmake/VulkanHost.cmake'
      - 'cmake/ShaderCache.cmake'
      - 'cmake/GpuResources.cmake'
      - '.github/workflows/windows-rexglue.yml'
permissions:
  contents: read
concurrency:
  group: rex-windows-${{ github.ref }}
  # Preserve an almost-finished full link when a follow-up fix is pushed.
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify pinned Windows SDK
        shell: pwsh
        run: |
          $pins = Get-Content rex/dependencies.json -Raw | ConvertFrom-Json
          $url = "https://github.com/$($pins.sdk.repository)/releases/download/$($pins.sdk.tag)/$($pins.sdk.windows_asset)"
          Invoke-WebRequest $url -OutFile sdk.zip
          if ((Get-FileHash sdk.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $pins.sdk.sha256) {
            throw 'SDK checksum mismatch'
          }
          Expand-Archive sdk.zip sdk-extract
          $configs = @(Get-ChildItem sdk-extract -Recurse -Filter rexglueConfig.cmake)
          if ($configs.Count -ne 1) { throw 'Expected one SDK package configuration' }
          $prefix = $configs[0].Directory.Parent.Parent.Parent.FullName
          "REXSDK_PREFIX=$prefix" | Add-Content $env:GITHUB_ENV
      - name: Fetch pinned shader codecs and resource hashing
        run: |
          git submodule update --init tools/XenosRecomp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C tools/XenosRecomp submodule update --init thirdparty/smol-v thirdparty/zstd thirdparty/xxHash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure SDK integration contracts
        run: >-
          cmake -S rex -B build-rex-contract -G "Visual Studio 17 2022" -A x64 -T ClangCL
          "-DCMAKE_PREFIX_PATH=$env:REXSDK_PREFIX" -DSONIC_REX_BUILD_GAME=OFF
      - name: Build and test forwarding contracts against the real SDK
        run: |
          cmake --build build-rex-contract --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-rex-contract -C Release --output-on-failure --timeout 30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test bounded GPU capture inspection
        run: python -m unittest discover -s rex/tests -p "test_*.py" -v
      - name: Read generated-code pin
        if: github.event_name == 'push' || inputs.build_game
        id: source
        run: |
          $pins = Get-Content rex/dependencies.json -Raw | ConvertFrom-Json
          "repository=$($pins.generated_candidate.repository)" | Add-Content $env:GITHUB_OUTPUT
          "commit=$($pins.generated_candidate.commit)" | Add-Content $env:GITHUB_OUTPUT
          "directory=$($pins.generated_candidate.directory)" | Add-Content $env:GITHUB_OUTPUT
      - name: Fetch candidate PPC from the user's reference project
        if: github.event_name == 'push' || inputs.build_game
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: build-rex-source
          sparse-checkout: ${{ steps.source.outputs.directory }}
          persist-credentials: false
      - name: Install native Vulkan build dependencies
        if: github.event_name == 'push' || inputs.build_game
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install vulkan-headers:x64-windows vulkan-loader:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure the separate game host
        if: github.event_name == 'push' || inputs.build_game
        run: >-
          cmake -S rex -B build-rex-game -G "Visual Studio 17 2022" -A x64 -T ClangCL
          "-DCMAKE_PREFIX_PATH=$env:REXSDK_PREFIX" -DSONIC_REX_BUILD_GAME=ON
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          "-DSONIC_REX_GENERATED_DIR=${{ github.workspace }}/build-rex-source/${{ steps.source.outputs.directory }}"
      - name: Compile real host and first generated TU before the full game
        if: github.event_name == 'push' || inputs.build_game
        run: cmake --build build-rex-game --config Release --target sonic_rex_api_probe --parallel 2
      - name: Link native Vulkan backend and decode embedded SPIR-V before PPC build
        if: github.event_name == 'push' || inputs.build_game
        run: |
          cmake --build build-rex-game --config Release --target rex_native_backend_link_test --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/vulkan-1.dll" build-rex-game/Release/
          ctest --test-dir build-rex-game -C Release -R '^rex_native_backend_link$' --output-on-failure --timeout 120
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build the candidate (fail on incompatible generated ABI)
        if: github.event_name == 'push' || inputs.build_game
        run: cmake --build build-rex-game --config Release --parallel 2
      - name: Game host CLI smoke test (not a game boot)
        if: github.event_name == 'push' || inputs.build_game
        run: |
          & ./build-rex-game/Release/SonicGenerationsRecomp-ReXGlue.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage reference-path package
        if: github.event_name == 'push' || inputs.build_game
        run: |
          New-Item -ItemType Directory package-rex | Out-Null
          Copy-Item build-rex-game/Release/SonicGenerationsRecomp-ReXGlue.exe package-rex/
          Get-ChildItem build-rex-game/Release/*.dll | Copy-Item -Destination package-rex/
          if (!(Test-Path package-rex/rexgpu-xenos.dll)) { throw 'Xenos reference plugin missing' }
          Copy-Item rex/tools package-rex/tools -Recurse
          Copy-Item rex/windows/*.cmd,rex/README.md,rex/dependencies.json,COPYING,THIRD_PARTY.md package-rex/
          Copy-Item licenses package-rex/licenses -Recurse
          foreach ($port in @('vulkan-headers','vulkan-loader')) {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/share/$port/copyright" "package-rex/licenses/$port-copyright.txt"
          }
          Copy-Item tools/XenosRecomp/thirdparty/xxHash/LICENSE package-rex/licenses/xxHash-LICENSE.txt
          Copy-Item tools/XenosRecomp/thirdparty/smol-v/license.txt package-rex/licenses/smol-v-LICENSE.txt
          Copy-Item tools/XenosRecomp/thirdparty/zstd/LICENSE package-rex/licenses/zstd-LICENSE.txt
          # Preserve the SDK's redistributed notices/resources, rather than stripping them.
          Copy-Item "$env:REXSDK_PREFIX/share" package-rex/sdk-share -Recurse
          Get-ChildItem "$env:REXSDK_PREFIX" -File | Where-Object { $_.Name -match 'LICENSE|COPYING|NOTICE' } | Copy-Item -Destination package-rex/
          git rev-parse HEAD | Set-Content package-rex/revision.txt
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || inputs.build_game
        with:
          name: windows-x64-rexglue-reference-candidate
          path: package-rex/
          if-no-files-found: error
      - name: State exactly what was checked
        run: |
          @'
          ## ReXGlue migration gate
          Passed: host forwarding/path/mode contracts against pinned SDK 0.10.0.
          Optional game build uses the pinned external generated-code candidate; no original XEX is uploaded.
          A built EXE / --help does NOT prove title boot, gameplay, shadow rendering or native GPU replacement.
          Reference Xenos plugin is retained and explicitly selected with Vulkan.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
