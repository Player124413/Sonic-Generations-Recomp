name: Android APK

on:
  push:
    paths:
      - "android/**"
      - "SonicGenerationsRecomp/**"
      - "SonicGenerationsRecompLib/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "SonicGenerationsRecomp/**"
      - "SonicGenerationsRecompLib/**"
      - "cmake/**"
      - "CMakeLists.txt"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  host-tests:
    name: Host module tests (ETC2, touch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and run dependency-free module tests
        run: |
          g++ -std=c++20 -Wall -Wextra -I SonicGenerationsRecomp \
            tests/texture_transcode_tests.cpp \
            SonicGenerationsRecomp/gpu/texture_transcode.cpp \
            SonicGenerationsRecomp/hid/touch_input.cpp \
            -o /tmp/texture_transcode_tests
          /tmp/texture_transcode_tests

  apk:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub ubuntu image ships the Android SDK (cmdline tools,
      # platform, build-tools). Installing the pinned NDK/CMake directly
      # avoids an extra setup action and its version drift.
      - name: Install NDK and CMake
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;26.3.11579264" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Build output is mirrored into check annotations on failure: the
      # runner log archive is not always downloadable, while annotations
      # stay readable through the API/UI.
      - name: Build debug APK
        working-directory: android
        run: |
          set +e
          gradle assembleDebug --stacktrace > /tmp/gradle-debug.log 2>&1
          code=$?
          tail -n 40 /tmp/gradle-debug.log
          if [ $code -ne 0 ]; then
            grep -E "error:|FAILED|What went wrong|Execution failed|Caused by:|^e: |Could not|failed" /tmp/gradle-debug.log | head -n 45 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::${esc}"
            done
          fi
          exit $code

      - name: Build release APK
        working-directory: android
        run: |
          set +e
          gradle assembleRelease --stacktrace > /tmp/gradle-release.log 2>&1
          code=$?
          tail -n 40 /tmp/gradle-release.log
          if [ $code -ne 0 ]; then
            grep -E "error:|FAILED|What went wrong|Execution failed|Caused by:|^e: |Could not|failed" /tmp/gradle-release.log | head -n 45 | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::${esc}"
            done
          fi
          exit $code

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-logs
          path: |
            /tmp/gradle-debug.log
            /tmp/gradle-release.log
          if-no-files-found: ignore

      - name: List APKs
        run: find android/app/build/outputs/apk -name "*.apk" -exec ls -la {} +

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: sonic-generations-recomp-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
