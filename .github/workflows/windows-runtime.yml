name: Windows x64 runtime
on:
  workflow_call:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-runtime.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'SonicGenerationsRecomp/**'
      - 'SonicGenerationsRecompLib/CMakeLists.txt'
      - 'tests/*.cpp'
      - 'tests/CMakeLists.txt'
      - 'tests/sdl_vulkan/**'
      - 'scripts/windows/**'
      - 'cmake/**'
concurrency:
  group: windows-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Launcher script tests (Windows PowerShell)
        shell: powershell
        run: ./scripts/windows/Launcher.ps1 -SelfTest
      - name: Fetch pinned sources
        run: |
          git submodule update --init tools/XenonRecomp tools/XenosRecomp tools/ffmpeg-xma
          git -C tools/XenonRecomp submodule update --init --recursive
          git -C tools/XenosRecomp submodule update --init thirdparty/smol-v thirdparty/zstd thirdparty/xxHash
      - name: Install Windows libraries
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "sdl2[vulkan]:x64-windows-static" vulkan-headers:x64-windows-static vulkan-loader:x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify SDL Windows Vulkan loader hook (no GPU required)
        run: |
          cmake -S tests/sdl_vulkan -B build-sdl-vulkan -G "Visual Studio 17 2022" -A x64 -T ClangCL "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-sdl-vulkan --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-sdl-vulkan -C Release --output-on-failure --timeout 30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure ClangCL runtime
        run: >-
          cmake -S . -B build-windows -G "Visual Studio 17 2022" -A x64 -T ClangCL
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS_RELEASE="/Od /DNDEBUG"
          -DCMAKE_C_FLAGS_RELEASE="/Od /DNDEBUG"
          -DSONIC_GENERATIONS_ENABLE_VULKAN=ON
      - name: Build executable and tests
        run: cmake --build build-windows --config Release --parallel 2
      - name: Runtime tests
        run: ctest --test-dir build-windows -C Release --output-on-failure --timeout 120
      - name: Executable smoke test
        run: |
          & ./build-windows/SonicGenerationsRecomp/Release/SonicGenerationsRecomp.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package Windows runtime
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item build-windows/SonicGenerationsRecomp/Release/SonicGenerationsRecomp.exe package/
          Get-ChildItem build-windows/SonicGenerationsRecomp/Release/*.dll -ErrorAction SilentlyContinue | Copy-Item -Destination package/
          Copy-Item COPYING,THIRD_PARTY.md,docs/TESTING_WINDOWS.md package/
          Copy-Item scripts/windows/*.cmd,scripts/windows/*.ps1 package/
          git rev-parse HEAD | Set-Content package/revision.txt
          New-Item -ItemType Directory package/licenses | Out-Null
          Copy-Item licenses/* package/licenses/
          Copy-Item tools/ffmpeg-xma/COPYING.LGPLv2.1 package/licenses/FFmpeg-LGPL.txt
          foreach ($port in @('sdl2','vulkan-headers','vulkan-loader')) {
            Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows-static/share/$port/copyright" "package/licenses/$port.txt"
          }
      - name: Packaged executable smoke test
        run: |
          & ./package/SonicGenerationsRecomp.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Packaged launcher tests
        shell: powershell
        run: |
          foreach ($file in @('Launcher.cmd', 'Launcher.ps1', 'Install-Game.cmd', 'Run-Diagnostic.cmd', 'TESTING_WINDOWS.md', 'revision.txt')) {
            if (!(Test-Path -LiteralPath "package/$file")) { throw "Missing package file: $file" }
          }
          ./package/Launcher.ps1 -SelfTest
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-diagnostic-runtime
          path: package/
          if-no-files-found: error
      - name: Download and installation instructions
        run: |
          @'
          ## Windows x64 / Vulkan package
          Download **windows-x64-diagnostic-runtime** from this run's Artifacts section.
          Extract the entire ZIP, then double-click **Launcher.cmd**.
          Select your own Xbox 360 ISO/XISO or dump folder and click **Install / extract**.
          Game files: `assets` beside the EXE; saves: `assets\save\SYS-DATA`.
          No portable marker is required. Keep the extracted runtime folder writable.
          Generated PPC and the supplied SPIR-V cache are already build inputs; no game upload is needed.
          Logs: `diagnostics` beside the EXE. This is a diagnostic runtime, not confirmed playable.
          '@ | Add-Content $env:GITHUB_STEP_SUMMARY
