name: Shader pipeline safety tests
on:
  push:
    paths:
      - 'scripts/shader_pipeline.py'
      - 'tests/test_shader_pipeline.py'
      - '.github/workflows/shader-pipeline-tests.yml'
  pull_request:
    paths:
      - 'scripts/shader_pipeline.py'
      - 'tests/test_shader_pipeline.py'
      - '.github/workflows/shader-pipeline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_shader_pipeline.py -v
